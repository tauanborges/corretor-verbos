services:
  - type: web
    name: conjuga-ciebtec
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conjuga-ciebtec-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: REVIEW_PASSWORD
        sync: false

databases:
  - name: conjuga-ciebtec-db
